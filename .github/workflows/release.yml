name: Release

# Dispara ao enviar uma tag de versão (ex.: git push origin v1.0.1)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # necessário para criar o Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pycaw comtypes sounddevice numpy pyrnnoise pywinusb

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build (PyInstaller + Inno)
        run: python build.py

      - name: Publicar Release com o instalador
        uses: softprops/action-gh-release@v2
        with:
          files: Output/FifineAM8-Setup-*.exe
          generate_release_notes: true
          body_path: CHANGELOG.md
